{% extends "base.html" %}
{% block title %}首页{% endblock %}
{% block content %}
<div class="welcome-section">
    <h1>简易用户信息管理平台</h1>
    <p class="subtitle">AI+安全实训项目 - 四川大学网络空间安全学院</p>

    {% if session.get('username') %}
        <div class="card welcome-card">
            <h3>欢迎回来，{{ session['username'] }}！</h3>
            <div class="quick-actions">
                <a href="/profile" class="btn btn-info">查看个人资料</a>
                <a href="/upload" class="btn btn-info">上传头像</a>
                <a href="/page?name=help" class="btn btn-info">帮助中心</a>
            </div>
        </div>
    {% else %}
        <div class="card welcome-card">
            <p>请登录或注册以使用本系统。</p>
            <div class="quick-actions">
                <a href="/login" class="btn btn-primary">登录</a>
                <a href="/register" class="btn btn-secondary">注册</a>
            </div>
        </div>
    {% endif %}
</div>
{% endblock %}
