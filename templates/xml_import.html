{% extends "base.html" %}
{% block title %}XML 数据导入{% endblock %}
{% block content %}
<div class="card xml-card">
    <h2>批量用户导入（XML）</h2>
    <p>上传 XML 格式的用户数据进行批量导入</p>
    <form method="POST" action="/xml-import">
        <div class="form-group">
            <label for="xml_data">XML 数据</label>
            <textarea id="xml_data" name="xml_data" rows="15" class="code-editor" placeholder="粘贴 XML 内容..."></textarea>
        </div>
        <button type="submit" class="btn btn-primary">导入</button>
    </form>
    {% if result %}
    <div class="import-result">
        <h3>导入结果:</h3>
        <pre class="console-output">{{ result }}</pre>
    </div>
    {% endif %}
</div>
{% endblock %}
