<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}用户信息管理平台{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="nav-brand">用户管理系统</a>
            <div class="nav-menu">
                {% if session.get('username') %}
                    <span class="nav-user">欢迎, {{ session['username'] }}</span>
                    <a href="/profile" class="nav-link">个人中心</a>
                    <a href="/upload" class="nav-link">上传头像</a>
                    <a href="/logout" class="nav-link">退出</a>
                {% else %}
                    <a href="/login" class="nav-link">登录</a>
                    <a href="/register" class="nav-link">注册</a>
                {% endif %}
            </div>
        </div>
    </nav>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <footer class="footer">
        <p>AI+安全实训项目 - 简易用户信息管理平台</p>
    </footer>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
